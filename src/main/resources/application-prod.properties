# Production baseline
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Production safety: do the one-time baseline explicitly before first deploy to an existing schema.
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
app.data-seeder.seed-products=false
app.mail.enabled=true
app.otp.dev-log=false
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Production secrets/config must be supplied explicitly; no development fallbacks.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${APP_JWT_SECRET}
app.razorpay.key-id=${APP_RAZORPAY_KEY_ID}
app.razorpay.key-secret=${APP_RAZORPAY_KEY_SECRET}
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

app.data-seeder.repair-invalid-image-urls=false

app.payment.auto-refund-captured-orphaned=false
