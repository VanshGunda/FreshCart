spring.application.name=FreshCart
server.port=${SERVER_PORT:8080}

# Local development defaults — override with environment variables for test/production.
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/freshcart}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Safe local-development fallback only. Production profile requires an environment secret.
app.jwt.secret=${APP_JWT_SECRET:FreshCartLocalJwtSecretKey_2026_ChangeForProduction_9f7a2c}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:1800000}

# Razorpay key id is public; secret must be supplied through the environment.
app.razorpay.key-id=${APP_RAZORPAY_KEY_ID:rzp_test_Td60QtsQtZL571}
app.razorpay.key-secret=${APP_RAZORPAY_KEY_SECRET:}

app.admin.username=${APP_ADMIN_USERNAME:admin@freshcart.com}
app.admin.password=${APP_ADMIN_PASSWORD:FreshCart@Admin123}
app.data-seeder.seed-products=${APP_SEED_PRODUCTS:true}
app.data-seeder.repair-invalid-image-urls=${APP_REPAIR_INVALID_IMAGE_URLS:true}

# Local development: OTPs can be logged instead of requiring SMTP configuration.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.otp.dev-log=${APP_OTP_DEV_LOG:true}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}}

app.payment.reservation-minutes=${APP_PAYMENT_RESERVATION_MINUTES:15}
app.payment.cleanup-delay-ms=${APP_PAYMENT_CLEANUP_DELAY_MS:60000}
app.payment.auto-refund-captured-orphaned=${APP_PAYMENT_AUTO_REFUND_ORPHANED:false}
app.security.rate-limit-cleanup-ms=${APP_SECURITY_RATE_LIMIT_CLEANUP_MS:300000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

spring.jackson.serialization.write-dates-as-timestamps=false

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024
